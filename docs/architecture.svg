<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100"><style>text{font-family:Arial,sans-serif;fill:#172c42}.title{font-size:36px;font-weight:700}.sub{font-size:17px;fill:#52677c}.section{font-size:20px;font-weight:700}.heading{font-size:17px;font-weight:700}.detail{font-size:15px;fill:#52677c}.box{fill:white;stroke:#b9c9d8;stroke-width:1.5}.blue{fill:#e9f2ff;stroke:#a8bed6}.focus{fill:#fff0df;stroke:#bd6f32;stroke-width:2}.line{stroke:#708396;stroke-width:2;fill:none;marker-end:url(#arrow)}.n{fill:#245081}.nt{fill:white;font-size:15px;font-weight:bold}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3Z" fill="#708396"/></marker></defs><rect width="1500" height="1100" fill="#f3f7fc"/><text class="title" x="50" y="60">ShopLedger architecture</text><text class="sub" x="50" y="90">Point of sale, Khata credit and printable GST invoices — current implementation</text><rect class="box blue" x="50" y="120" width="370" height="83" rx="8"/><text class="heading" x="66" y="147">public/ · Browser UI</text><text class="detail" x="66" y="172">POS, order history, Khata and GST audit</text><rect class="box blue" x="480" y="120" width="420" height="83" rx="8"/><text class="heading" x="496" y="147">server.js · Express</text><text class="detail" x="496" y="172">Serves public/ and GET /orders/:id/invoice</text><path class="line" d="M420 161 H480"/><text class="section" x="50" y="243">routes/   Mounted at /api by server.js</text><rect class="box" x="50" y="260" width="200" height="88" rx="8"/><text class="heading" x="66" y="287">products.js</text><text class="detail" x="66" y="312">Catalog and coupons</text><text class="detail" x="66" y="332">GET /products, /coupons</text><rect class="box" x="267" y="260" width="200" height="88" rx="8"/><text class="heading" x="283" y="287">orders.js</text><text class="detail" x="283" y="312">List, create and cancel</text><text class="detail" x="283" y="332">POST /orders</text><rect class="box" x="484" y="260" width="200" height="88" rx="8"/><text class="heading" x="500" y="287">customers.js</text><text class="detail" x="500" y="312">Khata and settlements</text><text class="detail" x="500" y="332">GET /customers</text><rect class="box" x="701" y="260" width="200" height="88" rx="8"/><text class="heading" x="717" y="287">reports.js</text><text class="detail" x="717" y="312">Dashboard and GST audit</text><text class="detail" x="717" y="332">Pricing and admin export</text><text class="section" x="50" y="390">lib/   Business logic and persistence</text><rect class="box" x="50" y="408" width="274" height="80" rx="8"/><text class="heading" x="66" y="435">inventory.js</text><text class="detail" x="66" y="460">Stock checks and changes</text><rect class="box" x="338" y="408" width="274" height="80" rx="8"/><text class="heading" x="354" y="435">pricing.js</text><text class="detail" x="354" y="460">Totals, discount and GST</text><rect class="box" x="626" y="408" width="274" height="80" rx="8"/><text class="heading" x="642" y="435">coupons.js</text><text class="detail" x="642" y="460">Coupon validation and caps</text><rect class="box" x="50" y="504" width="274" height="80" rx="8"/><text class="heading" x="66" y="531">tax.js</text><text class="detail" x="66" y="556">HSN rates; CGST/SGST</text><rect class="box" x="338" y="504" width="274" height="80" rx="8"/><text class="heading" x="354" y="531">orders.js</text><text class="detail" x="354" y="556">Order records and cancel</text><rect class="box" x="626" y="504" width="274" height="80" rx="8"/><text class="heading" x="642" y="531">ledger.js</text><text class="detail" x="642" y="556">Khata charges and settlements</text><rect class="box" x="50" y="600" width="274" height="80" rx="8"/><text class="heading" x="66" y="627">dates.js</text><text class="detail" x="66" y="652">Order and settlement dates</text><rect class="box" x="338" y="600" width="274" height="80" rx="8"/><text class="heading" x="354" y="627">reports.js</text><text class="detail" x="354" y="652">Dashboard and reconciliation</text><rect class="box focus" x="626" y="600" width="274" height="80" rx="8"/><text class="heading" x="642" y="627">invoice.js</text><text class="detail" x="642" y="652">Uses pricing.js for totals</text><text class="detail" x="642" y="672">Renders invoice HTML</text><rect class="box" x="50" y="696" width="274" height="80" rx="8"/><text class="heading" x="66" y="723">store.js</text><text class="detail" x="66" y="748">JSON reads, writes and audit</text><rect class="box" x="50" y="819" width="420" height="85" rx="8"/><text class="heading" x="66" y="846">data/db.json</text><text class="detail" x="66" y="871">Products, orders, customers, settlements</text><text class="detail" x="66" y="891">and audit records</text><rect class="box" x="490" y="819" width="411" height="85" rx="8"/><text class="heading" x="506" y="846">config.js</text><text class="detail" x="506" y="871">Shop settings, tax slabs, coupons</text><text class="detail" x="506" y="891">and inventory settings</text><path class="line" d="M187 776 V819"/><rect class="box" x="940" y="120" width="510" height="875" rx="8"/><text class="heading" x="956" y="147">Placing an order</text><circle cx="971" cy="190" r="16" class="n"/><text class="nt" x="966" y="195">1</text><text class="heading" x="1001" y="195">Submit the cart</text><text class="detail" x="1001" y="219">Browser sends POST /api/orders</text><text class="detail" x="1001" y="239">to routes/orders.js.</text><circle cx="971" cy="295" r="16" class="n"/><text class="nt" x="966" y="300">2</text><text class="heading" x="1001" y="300">Read and check stock</text><text class="detail" x="1001" y="324">store.read() loads data; inventory.find()</text><text class="detail" x="1001" y="344">and inventory.check() inspect items.</text><circle cx="971" cy="400" r="16" class="n"/><text class="nt" x="966" y="405">3</text><text class="heading" x="1001" y="405">Validate and price</text><text class="detail" x="1001" y="429">coupons.validate() checks the code.</text><text class="detail" x="1001" y="449">pricing.computeTotals() applies discount and GST.</text><circle cx="971" cy="505" r="16" class="n"/><text class="nt" x="966" y="510">4</text><text class="heading" x="1001" y="510">Charge Khata if selected</text><text class="detail" x="1001" y="534">ledger.chargeOrderToKhata() checks credit</text><text class="detail" x="1001" y="554">and updates the customer account.</text><circle cx="971" cy="610" r="16" class="n"/><text class="nt" x="966" y="615">5</text><text class="heading" x="1001" y="615">Reserve stock and add order</text><text class="detail" x="1001" y="639">inventory.reserve() changes stock;</text><text class="detail" x="1001" y="659">orders.add() records the order and totals.</text><circle cx="971" cy="715" r="16" class="n"/><text class="nt" x="966" y="720">6</text><text class="heading" x="1001" y="720">Audit and save</text><text class="detail" x="1001" y="744">store.appendAudit(), then store.write(),</text><text class="detail" x="1001" y="764">persist changes to data/db.json.</text><circle cx="971" cy="820" r="16" class="n"/><text class="nt" x="966" y="825">7</text><text class="heading" x="1001" y="825">Return the saved order</text><text class="detail" x="1001" y="849">HTTP 201 returns the order. Invoice requests</text><text class="detail" x="1001" y="869">render the stored order through invoice.js.</text><rect x="50" y="955" width="20" height="20" rx="3" class="focus"/><text class="detail" x="82" y="971">Ticket 1 module</text><text class="sub" x="50" y="1030">Invoice figures use the shared checkout pricing rules; tests use in-memory fixtures.</text></svg>